# Local lab: Jenkins (CI/CD) + SonarQube Community Build
#   docker compose up -d --build
#   Jenkins   http://localhost:8080   (admin / admin123 - local lab only)
#   SonarQube http://localhost:9000   (admin / admin, you are asked to change it)
services:
  jenkins:
    build: ./infra/jenkins
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - sonarqube

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      # avoids the vm.max_map_count requirement on Docker Desktop / WSL2
      SONAR_SEARCH_JAVAADDITIONALOPTS: "-Dnode.store.allow_mmap=false"
      # allow the webhook to Jenkins on the private docker network (local lab only)
      SONAR_VALIDATEWEBHOOKS: "false"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
